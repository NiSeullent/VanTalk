name: Desktop packages (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2026.7.29). Empty = artifacts only.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-nsis
            os: windows-latest
            bundles: nsis
          - name: linux-deb-rpm
            os: ubuntu-24.04
            bundles: deb,rpm
          - name: macos-app
            os: macos-latest
            bundles: app

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev rpm

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app' \
          \) -print -exec cp -v {} out/ \; || true
          # mac .app is a directory
          find src-tauri/target/release/bundle -type d -name '*.app' -maxdepth 3 2>/dev/null | while read d; do
            tar -C "$(dirname "$d")" -czf "out/$(basename "$d").tar.gz" "$(basename "$d")" || true
          done
          ls -lah out || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VanTalk-tauri-${{ matrix.name }}
          path: desktop/out/*
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: VanTalk-tauri-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f -print -exec cp -v {} upload/ \;
          ls -lah upload
          test "$(find upload -type f | wc -l)" -gt 0
          BODY="Van톡 Desktop (Tauri) ${TAG}

하이브리드 셸 — https://vantalk.nyase.kr/ 를 네이티브 창으로 엽니다.

Windows NSIS · Linux deb/rpm · macOS app 번들."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
            gh release edit "$TAG" --notes "$BODY"
          else
            gh release create "$TAG" upload/* --title "Van톡 Desktop ${TAG}" --notes "$BODY"
          fi
