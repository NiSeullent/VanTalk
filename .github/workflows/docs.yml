name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# GitHub Pages serves from branch main /docs (legacy).
# Actions deploy-pages is intentionally not used: account runners may be
# billing-locked, and committing the Vite build into docs/ is the publish path.
# Keep this workflow as a build check so docs-site stays green.

permissions:
  contents: read

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install & build
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      - name: Verify Pages root files
        run: |
          test -f docs/index.html
          test -f docs/404.html
          test -f docs/.nojekyll
